<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Làn C — Trực quan &amp; Chi phí · bản đồ cài đặt</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel-2:#ffffff; --line:#dfe4ec;
    --fg:#1a2029; --fg-dim:#4c5768; --fg-mute:#7a8697;
    --accent:#2f6bff;
    --z-user:#dfe5f2; --z-screen:#dee6fb; --z-api:#e0efdc; --z-infra:#ece5f3;
    --ok:#0f9a63; --warn:#c07c00; --danger:#dd4436;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel);
    display:flex;flex-wrap:wrap;gap:14px;align-items:center;
  }
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  header .hint{color:var(--fg-mute);font-size:12px}
  .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .tab{
    padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;
    color:var(--fg-dim);cursor:pointer;font-size:12.5px;font-family:inherit;
  }
  .tab:hover{border-color:var(--accent);color:var(--fg)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;display:flex;min-height:0}
  #canvasWrap{flex:1;overflow:auto;padding:18px 18px 60px}

  .routebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;font-size:11.5px;color:var(--fg-mute)}

  .zone{
    position:relative;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;
    padding:26px 12px 12px;background:rgba(255,255,255,.55);
  }
  .zone > .zlabel{
    position:absolute;top:6px;left:12px;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--fg-mute);font-weight:700;background:var(--bg);padding:0 5px;border-radius:4px;
  }
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .flowarrow{text-align:center;color:var(--fg-mute);font-size:18px;margin:-8px 0 6px;line-height:1}

  .node{
    position:relative;min-width:190px;max-width:250px;flex:1 1 190px;
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;
    background:var(--panel-2);box-shadow:0 1px 2px rgba(20,30,50,.06);
    transition:transform .12s,border-color .12s,box-shadow .12s;
    font-family:inherit;text-align:left;color:inherit;
  }
  .node:hover{transform:translateY(-2px);border-color:var(--accent)}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,107,255,.28)}
  .node .nm{font-weight:640;font-size:13px;line-height:1.3}
  .node .sb{color:var(--fg-mute);font-size:11px;margin-top:3px}
  .node .badge{
    display:inline-block;margin-top:6px;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;
    padding:1px 6px;border-radius:4px;background:rgba(20,30,50,.07);color:var(--fg-dim);
  }
  .node .badge.ok{background:#e6f5ee;color:#0b6b46}
  .node .badge.warn{background:#fdf1dc;color:#8a5a00}
  .z-user   .node{background:color-mix(in srgb,var(--z-user) 62%,var(--panel-2))}
  .z-screen .node{background:color-mix(in srgb,var(--z-screen) 62%,var(--panel-2))}
  .z-api    .node{background:color-mix(in srgb,var(--z-api) 62%,var(--panel-2))}
  .z-infra  .node{background:color-mix(in srgb,var(--z-infra) 62%,var(--panel-2))}

  aside{
    width:430px;flex:none;border-left:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:16px 18px 40px;
  }
  aside h2{font-size:15.5px;margin:0 0 2px}
  aside .sub{color:var(--fg-mute);font-size:12px;margin-bottom:12px}
  aside h3{
    font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--fg-mute);
    margin:18px 0 7px;border-top:1px solid var(--line);padding-top:11px;
  }
  aside h3:first-of-type{border-top:0;padding-top:0}
  aside p{margin:0 0 8px;color:var(--fg-dim)}
  aside ul{margin:0 0 8px;padding-left:18px;color:var(--fg-dim)}
  aside li{margin-bottom:5px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#f2f5fa;border:1px solid var(--line);color:var(--fg-dim)}
  .chip.infra{background:#f3eefa;border-color:#e0d5f0;color:#5b3d86}
  .files{list-style:none;margin:0;padding:0}
  .files li{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--fg-mute);
    background:#f8fafc;border:1px solid var(--line);border-radius:6px;padding:4px 7px;margin-bottom:4px;word-break:break-all}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#1d4ed8}
  .why{background:#eef3ff;border:1px solid #c9d8ff;border-radius:8px;padding:9px 11px;margin:0 0 10px;
    font-size:12.5px;color:#26406e;line-height:1.5}
  .why b{color:#16305e}
  .ba{display:grid;grid-template-columns:1fr;gap:7px;margin-bottom:10px}
  .ba div{border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12px;line-height:1.45}
  .ba .before{background:#fbf3f2;border-color:#f0d5d2;color:#7a3630}
  .ba .after{background:#eef7f2;border-color:#cbe6d8;color:#1d5f43}
  .ba span{display:block;font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;margin-bottom:2px;opacity:.75}
  table.mini{width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px}
  table.mini th,table.mini td{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
  table.mini th{background:#f2f5fa;color:var(--fg-mute);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
  .placeholder{color:var(--fg-mute);font-size:12.5px;line-height:1.6}
</style>
</head>

<main>

const DATA = {work:WORK, flow:FLOW, ux:UX, stack:STACK};

/* ───────────────────────── RENDER ───────────────────────── */
const $tabs = document.getElementById('tabs');
const $zones = document.getElementById('zones');
const $panel = document.getElementById('panel');
let tab = 'work', sel = null;

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function renderTabs(){
  $tabs.innerHTML = '';
  for (const t of TABS){
    const b = document.createElement('button');
    b.className = 'tab' + (t.id === tab ? ' on' : '');
    b.textContent = t.label;
    b.onclick = () => { tab = t.id; sel = null; render(); };
    $tabs.appendChild(b);
  }
}

function render(){
  renderTabs();
  const meta = TABS.find((t) => t.id === tab);
  const groups = DATA[tab];
  let html = `<div class="routebar">${esc(meta.hint)}</div>`;
  groups.forEach((g, gi) => {
    html += `<div class="zone ${g.cls}"><div class="zlabel">${esc(g.zone)}</div><div class="row">`;
    for (const it of g.items){
      const badge = it.badge
        ? `<span class="badge ${it.badge}">${esc(it.badgeText || '')}</span>` : '';
      html += `<button class="node${sel === it.id ? ' sel' : ''}" data-id="${it.id}">
        <div class="nm">${it.nm}</div><div class="sb">${esc(it.sb || '')}</div>${badge}</button>`;
    }
    html += `</div></div>`;
    if (tab === 'flow' && gi < groups.length - 1) html += `<div class="flowarrow">↓</div>`;
  });
  $zones.innerHTML = html;
  for (const b of $zones.querySelectorAll('.node')) b.onclick = () => { sel = b.dataset.id; render(); };
  renderPanel();
}

function renderPanel(){
  if (!sel){
    $panel.innerHTML = `<h2>${esc(TABS.find((t) => t.id === tab).label)}</h2>
      <div class="sub">Chưa chọn ô nào</div>
      <p class="placeholder">${esc(TABS.find((t) => t.id === tab).hint)}</p>
      <h3>File này là gì</h3>
      <p class="placeholder">Anh em với <code>product-flow-map.html</code>. File kia trả lời
        <b>"sản phẩm chạy thế nào"</b>; file này trả lời <b>"làn C đã thêm gì, vì sao làm thế,
        và dựng bằng gì"</b>.</p>`;
    return;
  }
  const it = DATA[tab].flatMap((g) => g.items).find((x) => x.id === sel);
  if (!it) return;

  let h = `<h2>${it.nm}</h2><div class="sub">${esc(it.sb || '')}</div>`;
  if (it.step) h += `<h3>Bám vào mục nào của đề</h3><p>${it.step}</p>`;
  if (it.what) h += `<h3>Làm gì</h3><p>${it.what}</p>`;
  if (it.before || it.after){
    h += `<h3>Trước và sau</h3><div class="ba">
      <div class="before"><span>Trước</span>${it.before}</div>
      <div class="after"><span>Sau</span>${it.after}</div></div>`;
  }
  if (it.why) h += `<div class="why"><b>Vì sao.</b> ${it.why}</div>`;
  if (it.note) h += `<div class="why" style="background:#fdf6e8;border-color:#f0e0bd;color:#6b4e12"><b>Đáng lưu ý.</b> ${it.note}</div>`;
  if (it.decisions && it.decisions.length){
    h += `<h3>Quyết định thiết kế</h3><ul>${it.decisions.map((d) => `<li>${d}</li>`).join('')}</ul>`;
  }
  if (it.tech && it.tech.length){
    h += `<h3>Techstack</h3><div class="chips">${it.tech.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>`;
  }
  if (it.files && it.files.length){
    h += `<h3>File</h3><ul class="files">${it.files.map((f) => `<li>${esc(f)}</li>`).join('')}</ul>`;
  }
  $panel.innerHTML = h;
}

render();
</script>
