<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpecResearch Loop — Bản đồ luồng sản phẩm</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#ffffff; --panel-2:#ffffff; --line:#dfe4ec;
    --fg:#1a2029; --fg-dim:#4c5768; --fg-mute:#7a8697;
    --accent:#2f6bff;
    --c-ui:#8b45d0; --c-http:#0d8f95; --c-sse:#c07c00; --c-db:#8892a3;
    --c-llm:#dd4436; --c-ext:#0f9a63; --c-local:#2f6bff;
    --z-user:#dfe5f2; --z-screen:#dee6fb; --z-api:#e0efdc; --z-infra:#ece5f3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    padding:12px 18px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; flex-wrap:wrap; gap:14px; align-items:center;
  }
  header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
  header .hint{color:var(--fg-mute);font-size:12px}
  .tabs{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
  .tab{
    padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:transparent;
    color:var(--fg-dim);cursor:pointer;font-size:12.5px;font-family:inherit;
  }
  .tab:hover{border-color:var(--accent);color:var(--fg)}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  main{flex:1;display:flex;min-height:0}
  #canvasWrap{flex:1;overflow:auto;position:relative;padding:18px 18px 60px}
  #edges{position:absolute;inset:0;pointer-events:none;overflow:visible}

  .routebar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;
    font-size:11.5px;color:var(--fg-mute);
  }
  .routebar code{font-size:11px}

  .zone{
    position:relative;margin-bottom:14px;border:1px solid var(--line);border-radius:12px;
    padding:26px 12px 12px;background:rgba(255,255,255,.55);
  }
  .zone > .zlabel{
    position:absolute;top:6px;left:12px;font-size:10.5px;letter-spacing:1.4px;
    text-transform:uppercase;color:var(--fg-mute);font-weight:700;
    background:var(--bg);padding:0 5px;border-radius:4px;
  }
  .row{display:flex;flex-wrap:wrap;gap:10px}

  .node{
    position:relative;min-width:178px;max-width:238px;flex:1 1 178px;
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;
    background:var(--panel-2);box-shadow:0 1px 2px rgba(20,30,50,.06);
    transition:transform .12s,border-color .12s,box-shadow .12s,opacity .15s;
    font-family:inherit;text-align:left;color:inherit;
  }
  .node:hover{transform:translateY(-2px);border-color:var(--accent)}
  .node.sel{border-color:var(--accent);box-shadow:0 0 0 2px rgba(47,107,255,.28)}
  .node.dim{opacity:.34}
  .node .nm{font-weight:640;font-size:13px;line-height:1.3}
  .node .sb{color:var(--fg-mute);font-size:11px;margin-top:3px}
  .node .badge{
    display:inline-block;margin-top:6px;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;
    padding:1px 6px;border-radius:4px;background:rgba(20,30,50,.07);color:var(--fg-dim);
  }
  .z-user   .node{background:color-mix(in srgb,var(--z-user) 62%,var(--panel-2))}
  .z-screen .node{background:color-mix(in srgb,var(--z-screen) 62%,var(--panel-2))}
  .z-api    .node{background:color-mix(in srgb,var(--z-api) 62%,var(--panel-2))}
  .z-infra  .node{background:color-mix(in srgb,var(--z-infra) 62%,var(--panel-2))}

  path.edge{fill:none;stroke-width:1.6;opacity:.42;transition:opacity .15s,stroke-width .15s}
  path.edge.hi{opacity:1;stroke-width:2.6}
  path.edge.off{opacity:.07}
  .elabel{font-size:10px;font-weight:600;fill:var(--fg-dim);paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round}
  .elabel.off{opacity:0}

  aside{
    width:412px;flex:none;border-left:1px solid var(--line);background:var(--panel);
    overflow:auto;padding:16px 18px 40px;
  }
  aside h2{font-size:15.5px;margin:0 0 2px}
  aside .sub{color:var(--fg-mute);font-size:12px;margin-bottom:12px}
  aside h3{
    font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--fg-mute);
    margin:18px 0 7px;border-top:1px solid var(--line);padding-top:11px;
  }
  aside h3:first-of-type{border-top:0;padding-top:0}
  aside p{margin:0 0 8px;color:var(--fg-dim)}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chip{font-size:11px;padding:2px 8px;border-radius:999px;background:#f2f5fa;border:1px solid var(--line);color:var(--fg-dim)}
  .chip.infra{background:#f3eefa;border-color:#e0d5f0;color:#5b3d86}

  ul.calls{list-style:none;margin:0;padding:0}
  ul.calls li{
    padding:7px 9px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;
    background:#f8fafc;cursor:pointer;
  }
  ul.calls li:hover{border-color:var(--accent)}
  ul.calls li.hit{border-color:var(--accent);background:#eef3ff;box-shadow:0 0 0 3px rgba(47,107,255,.12)}
  ul.calls .who{font-weight:620;font-size:12.5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .stepno{
    display:inline-block;flex:none;font-size:10px;font-weight:750;letter-spacing:.3px;
    padding:1px 6px;border-radius:999px;font-variant-numeric:tabular-nums;
    background:var(--accent);color:#fff;
  }
  .stepno.none{background:#eef0f4;color:var(--fg-mute);font-weight:600}

  .crumb{
    display:flex;align-items:flex-start;gap:8px;margin:10px 0 2px;
    padding:8px 10px;border-radius:8px;background:#eef3ff;border:1px solid #c9d8ff;
  }
  .crumb .cb{
    flex:none;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:999px;
    background:var(--accent);color:#fff;font-variant-numeric:tabular-nums;
  }
  .crumb .ct{font-size:11.5px;color:#26406e;line-height:1.45}
  .crumb .cx{flex:none;margin-left:auto;border:0;background:transparent;cursor:pointer;color:#5b76a8;font-size:13px;padding:2px 4px;border-radius:4px}
  .crumb .cx:hover{background:#dbe5fb;color:#26406e}

  .stephint{font-size:11.5px;color:var(--fg-mute);margin:0 0 8px;line-height:1.5}
  ul.calls .rpcline{margin-top:5px;display:flex;align-items:baseline;gap:2px;flex-wrap:wrap}
  ul.calls .rpcline code{font-size:11px;color:#1d4ed8;word-break:break-word}
  ul.calls .kv{font-size:11.5px;color:var(--fg-dim);margin-top:5px;line-height:1.45}
  ul.calls .kv b{
    display:inline-block;min-width:64px;font-size:9.5px;letter-spacing:.6px;text-transform:uppercase;
    color:var(--fg-mute);font-weight:700;vertical-align:top;
  }
  ul.calls .args,ul.calls .resp,ul.calls .path{
    display:block;margin-top:2px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    border-radius:6px;padding:5px 7px;word-break:break-word;font-size:10.5px;
  }
  ul.calls .args{color:#334155;background:#eef2f8;border:1px solid var(--line)}
  ul.calls .resp{color:#22543d;background:#eaf5ee;border:1px solid #c5e3d1}
  ul.calls .path{color:var(--fg-mute);font-size:10px;background:transparent;padding:2px 0;word-break:break-all}
  ul.calls .path .arrow{color:var(--accent);font-weight:700}
  .proto{
    display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
    padding:1px 6px;border-radius:4px;margin-right:6px;color:#fff;
  }
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:#1d4ed8}
  .files{list-style:none;margin:0;padding:0}
  .files li{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.8px;color:var(--fg-mute);margin-bottom:4px;word-break:break-all}

  ul.cases{list-style:none;margin:0;padding:0}
  ul.cases li{
    font-size:11.8px;line-height:1.5;color:var(--fg-dim);
    padding:6px 9px;border-radius:7px;margin-bottom:5px;
    background:#fbfcfe;border:1px solid var(--line);border-left:3px solid var(--c-ui);
  }
  ul.cases li.err{border-left-color:#dd4436;background:#fff6f5}
  ul.cases li.ok{border-left-color:#0f9a63;background:#f4fbf7}
  ul.cases li b{color:var(--fg);font-weight:640}

  .legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:11px;color:var(--fg-mute);margin-top:14px}
  .legend .lg{display:flex;gap:5px;align-items:center}
  .legend .sw{width:16px;height:3px;border-radius:2px}

  ol.steps{margin:0;padding-left:22px;color:var(--fg-dim);font-variant-numeric:tabular-nums}
  ol.steps li{margin-bottom:7px;cursor:pointer}
  ol.steps li:hover{color:var(--accent)}
  ol.steps li::marker{color:var(--accent);font-weight:750;font-size:11.5px}
  ol.steps li.on{color:var(--accent);font-weight:600}

  .staticnote{
    font-size:12px;line-height:1.6;color:var(--fg-dim);background:#f8fafc;
    border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  }
  @media (max-width:1080px){
    body{overflow:auto}
    main{flex-direction:column}
    aside{width:auto;border-left:0;border-top:1px solid var(--line)}
    #canvasWrap{overflow:visible}
  }
</style>
</head>
<body>

<header>
  <h1>SpecResearch Loop — Bản đồ luồng sản phẩm</h1>
  <span class="hint">4 tab = 4 mục trên thanh điều hướng · click 1 node hoặc 1 bước để xem thiết kế kỹ thuật</span>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="canvasWrap">
    <svg id="edges"></svg>
    <div id="zones"></div>
  </div>
  <aside id="panel"></aside>
</main>

  {id:'projects', label:'Dự án',             route:'/projects',  hint:'Tab nặng nhất — danh sách dự án và trọn wizard 5 bước.'},

/* ═══════════════════════ RENDER ═══════════════════════ */
const $ = (s) => document.querySelector(s);
let TAB = 'projects', SEL = null, STEP = null;

function tabNodes(){ return NODES.filter(n => n.tab === TAB); }
function tabEdges(){ return EDGES.filter(e => e.tab === TAB); }
function nodeById(id){ return NODES.find(n => n.id === id); }

function renderTabs(){
  $('#tabs').innerHTML = TABS.map(t =>
    `<button class="tab ${t.id===TAB?'on':''}" data-tab="${t.id}">${t.label}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => {
    TAB = b.dataset.tab; SEL = null; STEP = null; renderAll();
  });
}

function renderCanvas(){
  const meta = TABS.find(t => t.id === TAB);
  const used = ZONES.filter(z => tabNodes().some(n => n.zone === z.id));
  const html = [`<div class="routebar"><b>Route:</b> <code>${meta.route}</code> · ${meta.hint}</div>`];
  for(const z of used){
    const inZone = tabNodes().filter(n => n.zone === z.id);
    html.push(`<div class="zone z-${z.id}"><span class="zlabel">${z.label}</span><div class="row">` +
      inZone.map(n => `<button class="node" data-id="${n.id}">
        <div class="nm">${n.name}</div><div class="sb">${n.sub}</div>
        ${n.badge?`<span class="badge">${n.badge}</span>`:''}</button>`).join('') +
      `</div></div>`);
  }
  html.push(`<div class="legend">` + Object.entries(KIND).map(([k,v]) =>
    `<span class="lg"><span class="sw" style="background:${v.color}"></span>${v.label}</span>`).join('') + `</div>`);
  $('#zones').innerHTML = html.join('');
  $('#zones').querySelectorAll('.node').forEach(b => b.onclick = () => {
    SEL = (SEL === b.dataset.id) ? null : b.dataset.id; STEP = null; paint();
  });
}

/** Vẽ đường nối giữa hai node theo vị trí thật trong DOM. */
function drawEdges(){
  const svg = $('#edges'), wrap = $('#canvasWrap');
  const base = wrap.getBoundingClientRect();
  svg.setAttribute('width', wrap.scrollWidth);
  svg.setAttribute('height', wrap.scrollHeight);
  const parts = [];
  tabEdges().forEach((e, i) => {
    const a = $(`.node[data-id="${e.f}"]`), b = $(`.node[data-id="${e.t}"]`);
    if(!a || !b) return;
    const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
    const x1 = ra.left - base.left + wrap.scrollLeft + ra.width/2;
    const y1 = ra.top  - base.top  + wrap.scrollTop  + ra.height;
    const x2 = rb.left - base.left + wrap.scrollLeft + rb.width/2;
    const y2 = rb.top  - base.top  + wrap.scrollTop;
    const my = (y1 + y2) / 2;
    parts.push(`<path class="edge" id="ed${i}" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}" stroke="${KIND[e.k].color}"/>`);
    parts.push(`<text class="elabel" id="el${i}" x="${(x1+x2)/2}" y="${my-3}" text-anchor="middle">${e.st}</text>`);
  });
  svg.innerHTML = parts.join('');
  paintEdges();
}

function paintEdges(){
  tabEdges().forEach((e, i) => {
    const p = $(`#ed${i}`), l = $(`#el${i}`);
    if(!p) return;
    const touched = SEL ? (e.f === SEL || e.t === SEL) : true;
    const isStep  = STEP !== null && e.st === STEP;
    p.classList.toggle('hi', isStep || (SEL && touched));
    p.classList.toggle('off', (SEL && !touched) || (STEP !== null && !isStep));
    if(l) l.classList.toggle('off', (SEL && !touched) || (STEP !== null && !isStep));
  });
}

function paint(){
  $('#zones').querySelectorAll('.node').forEach(b => {
    const id = b.dataset.id;
    const touched = SEL ? (id === SEL || tabEdges().some(e =>
      (e.f === SEL && e.t === id) || (e.t === SEL && e.f === id))) : true;
    b.classList.toggle('sel', id === SEL);
    b.classList.toggle('dim', !!SEL && !touched);
  });
  paintEdges();
  renderPanel();
}

function callLi(e, hit){
  const i = tabEdges().indexOf(e);
  return `<li data-step="${e.st}" class="${hit?'hit':''}">
    <div class="who"><span class="stepno">${e.st}</span>
      <span class="proto" style="background:${KIND[e.k].color}">${e.k}</span>
      ${nodeById(e.f)?.name ?? e.f} → ${nodeById(e.t)?.name ?? e.t}</div>
    <div class="rpcline"><code>${e.api}</code></div>
    <div class="kv"><b>Thao tác</b> ${e.act}</div>
    <div class="kv"><b>Mục đích</b> ${e.why}</div>
    <div class="kv"><b>Kết quả</b><span class="resp">${e.resp}</span></div>
    <div class="path">${e.src} <span class="arrow">→</span> ${e.dst}</div>
  </li>`;
}

function renderPanel(){
  const meta = TABS.find(t => t.id === TAB);
  const p = $('#panel');

  if(!SEL){
    const steps = tabEdges();
    p.innerHTML = `<h2>${meta.label}</h2>
      <div class="sub"><code>${meta.route}</code></div>
      <p>${meta.hint}</p>
      <h3>Trình tự thao tác</h3>
      <p class="stephint">Bấm một bước để soi đúng đường nối đó, hoặc bấm một node để xem thiết kế kỹ thuật.</p>
      <ol class="steps">${steps.map(e =>
        `<li data-step="${e.st}" class="${STEP===e.st?'on':''}">${e.act}</li>`).join('')}</ol>
      ${STEP !== null ? `<h3>Bước ${STEP}</h3><ul class="calls">${
        steps.filter(e => e.st === STEP).map(e => callLi(e, true)).join('')}</ul>` : ''}`;
  } else {
    const n = nodeById(SEL);
    const ins  = tabEdges().filter(e => e.t === SEL);
    const outs = tabEdges().filter(e => e.f === SEL);
    p.innerHTML = `<h2>${n.name}</h2>
      <div class="sub">${n.sub}${n.badge?` · ${n.badge}`:''}</div>
      ${STEP !== null ? `<div class="crumb"><span class="cb">${STEP}</span>
        <span class="ct">Đang xem từ bước ${STEP} của trình tự.</span>
        <button class="cx" id="crumbClear" title="Bỏ neo bước">✕</button></div>` : ''}
      <h3>Mục đích</h3><p>${n.purpose}</p>
      ${n.tech.length ? `<h3>Techstack</h3><div class="chips">${
        n.tech.map(t => `<span class="chip">${t}</span>`).join('')}</div>` : ''}
      ${n.infra.length ? `<h3>Hạ tầng chạm tới</h3><div class="chips">${
        n.infra.map(t => `<span class="chip infra">${t}</span>`).join('')}</div>` : ''}
      ${n.cases.length ? `<h3>Trường hợp thao tác</h3><ul class="cases">${
        n.cases.map(c => `<li class="${c.t}">${c.s}</li>`).join('')}</ul>` : ''}
      ${outs.length ? `<h3>Gọi ra</h3><ul class="calls">${
        outs.map(e => callLi(e, e.st === STEP)).join('')}</ul>` : ''}
      ${ins.length ? `<h3>Được gọi từ</h3><ul class="calls">${
        ins.map(e => callLi(e, e.st === STEP)).join('')}</ul>` : ''}
      ${n.files.length ? `<h3>File liên quan</h3><ul class="files">${
        n.files.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}`;
  }

  p.querySelectorAll('[data-step]').forEach(el => el.onclick = () => {
    STEP = (STEP === el.dataset.step) ? null : el.dataset.step;
    paint();
  });
  const cc = $('#crumbClear');
  if(cc) cc.onclick = (ev) => { ev.stopPropagation(); STEP = null; paint(); };
}

function renderAll(){
  renderTabs(); renderCanvas(); paint();
  requestAnimationFrame(drawEdges);
}

window.addEventListener('resize', () => requestAnimationFrame(drawEdges));
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape'){ SEL = null; STEP = null; paint(); }
});
renderAll();
</script>
